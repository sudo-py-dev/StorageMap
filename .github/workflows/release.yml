name: Release

# Push a tag like v0.2.0 (matching the workspace version) to publish.
# Modelled on ripgrep: the release is created as a draft, every job uploads
# its own assets, and it is only published once all assets and SHA256SUMS
# are in place, so the in-app updater never sees a half-finished release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write # build provenance signing
  attestations: write # record the attestation

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Check the tag matches Cargo.toml
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^version = \"$version\"" Cargo.toml; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "StorageMap $GITHUB_REF_NAME"

  windows:
    needs: create-release
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p storagemap
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc /DAppVersion=${{ env.VERSION }} installer\windows\storagemap.iss
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path target\release\storagemap.exe, README.md -DestinationPath target\installer\StorageMap-${{ env.VERSION }}-windows-x64-portable.zip
      - name: Attest build provenance
        # Attestations need a public repository (or GitHub Enterprise).
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/installer/*
      - name: Upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" target/installer/*

  linux:
    needs: create-release
    runs-on: ubuntu-22.04 # older glibc: the .deb runs on more distributions
    env:
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deb
      - run: cargo deb --locked -p storagemap
      - name: Collect assets
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          tar -C target/release -czf "dist/StorageMap-$VERSION-linux-x86_64.tar.gz" storagemap
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checksums over the exact uploaded files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist && cd dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"
