version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot updates the pin and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release: compromised versions are
    # usually caught and pulled within days.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      egui:
        patterns: ["egui*", "eframe", "epaint*", "emath", "ecolor"]
