[package]
name = "storagemap-core"
description = "Fast parallel disk usage scanner with OS-specific backends"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8"
sha2 = "0.11"
rayon = "1.12"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO",
  "Win32_System_Ioctl", "Win32_Security", "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[features]
serde = ["dep:serde"]
